<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">TranZact PDF Generation  Architecture</title>
  <desc id="desc">Hybrid design: Django edge, PostgreSQL job queue, Redis progress and semaphore, isolated Puppeteer worker, object storage. Single and bulk data flows.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#047857"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#334155; stroke-width:1.5; }
      .boxExisting { fill:#f8fafc; stroke:#64748b; stroke-width:1.5; stroke-dasharray:4 3; }
      .boxWorker { fill:#fff7ed; stroke:#c2410c; stroke-width:1.75; }
      .boxStore { fill:#ecfdf5; stroke:#047857; stroke-width:1.75; }
      .title { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:18px; font-weight:700; fill:#0f172a; }
      .subtitle { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:11px; fill:#475569; }
      .label { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:12px; font-weight:600; fill:#0f172a; }
      .small { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:10px; fill:#334155; }
      .flow { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:10px; font-weight:600; }
      .legend { font-family:Segoe UI, Helvetica, Arial, sans-serif; font-size:10px; fill:#334155; }
      .group { fill:#f1f5f9; stroke:#cbd5e1; stroke-width:1; }
    </style>
  </defs>

  <rect width="1100" height="720" fill="#ffffff"/>
  <text x="40" y="36" class="title">PDF Generation Microservice  Chosen Architecture</text>
  <text x="40" y="56" class="subtitle">Hybrid singles/bulk · Snapshot payloads · Lean isolated Puppeteer worker · Matches APPROACH.md / design.md</text>

  <!-- Clients -->
  <rect x="40" y="90" width="140" height="70" rx="8" class="box"/>
  <text x="110" y="120" text-anchor="middle" class="label">ERP Users / UI</text>
  <text x="110" y="140" text-anchor="middle" class="small">PO &amp; invoice downloads</text>

  <!-- Django group -->
  <rect x="220" y="80" width="260" height="200" rx="10" class="group"/>
  <text x="236" y="102" class="small" fill="#64748b">Existing monolith (EC2 r6i.large)</text>
  <rect x="240" y="118" width="220" height="140" rx="8" class="boxExisting"/>
  <text x="350" y="148" text-anchor="middle" class="label">Django API edge</text>
  <text x="350" y="168" text-anchor="middle" class="small">Assemble snapshot JSON</text>
  <text x="350" y="184" text-anchor="middle" class="small">Enqueue jobs · admission control</text>
  <text x="350" y="200" text-anchor="middle" class="small">Status / progress APIs</text>
  <text x="350" y="216" text-anchor="middle" class="small">HTML templates (render input)</text>
  <text x="350" y="240" text-anchor="middle" class="small">No Chromium on this host</text>

  <!-- Data plane -->
  <rect x="520" y="80" width="220" height="200" rx="10" class="group"/>
  <text x="536" y="102" class="small" fill="#64748b">Existing data plane (reused)</text>
  <rect x="540" y="118" width="180" height="70" rx="8" class="boxExisting"/>
  <text x="630" y="148" text-anchor="middle" class="label">PostgreSQL RDS</text>
  <text x="630" y="166" text-anchor="middle" class="small">Jobs · batches · payloads</text>
  <text x="630" y="180" text-anchor="middle" class="small">Hashes / HMAC · queue</text>
  <rect x="540" y="200" width="180" height="60" rx="8" class="boxExisting"/>
  <text x="630" y="226" text-anchor="middle" class="label">Redis</text>
  <text x="630" y="244" text-anchor="middle" class="small">Progress · c_max semaphore</text>

  <!-- Worker -->
  <rect x="780" y="100" width="260" height="160" rx="10" class="group" fill="#fff7ed" stroke="#fdba74"/>
  <text x="796" y="122" class="small" fill="#9a3412">Isolated render tier (new)</text>
  <rect x="800" y="140" width="220" height="100" rx="8" class="boxWorker"/>
  <text x="910" y="172" text-anchor="middle" class="label">Puppeteer worker</text>
  <text x="910" y="192" text-anchor="middle" class="small">HTML ’ PDF · c_max = 2..3</text>
  <text x="910" y="208" text-anchor="middle" class="small">Claim jobs (SKIP LOCKED)</text>
  <text x="910" y="224" text-anchor="middle" class="small">Singles prioritized over bulk</text>

  <!-- Object storage -->
  <rect x="780" y="300" width="260" height="110" rx="8" class="boxStore"/>
  <text x="910" y="336" text-anchor="middle" class="label">Object storage</text>
  <text x="910" y="356" text-anchor="middle" class="small">pdf/{job_id}.pdf · zip/{batch_id}.zip</text>
  <text x="910" y="374" text-anchor="middle" class="small">Hot TTL · optional compliance archive</text>
  <text x="910" y="392" text-anchor="middle" class="small">Range / re-mintable download URLs</text>

  <!-- Flow arrows: clients to django -->
  <line x1="180" y1="125" x2="238" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="185" y="112" class="flow" fill="#1d4ed8">1. POST single / bulk</text>
  <text x="185" y="124" class="flow" fill="#1d4ed8">   (+ snapshot JSON)</text>

  <!-- django to postgres/redis -->
  <line x1="460" y1="170" x2="538" y2="155" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="200" x2="538" y2="225" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="148" class="small">2. Persist jobs</text>

  <!-- worker claims from postgres -->
  <path d="M720,155 C750,155 760,180 798,180" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="722" y="148" class="flow" fill="#c2410c">3. Claim work</text>

  <!-- worker to redis -->
  <path d="M800,220 C760,250 700,250 630,250" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="268" class="small" fill="#c2410c">4. Semaphore / progress</text>

  <!-- worker to object storage -->
  <line x1="910" y1="240" x2="910" y2="298" stroke="#047857" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="920" y="275" class="flow" fill="#047857">5. PUT PDF / ZIP</text>

  <!-- download path -->
  <path d="M780,360 C600,420 300,420 180,160" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <text x="300" y="430" class="flow" fill="#047857">6. Download (single file or ZIP / per-PDF) · retry ` re-render</text>

  <!-- status poll -->
  <path d="M110,160 C110,320 280,320 350,260" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowBlue)"/>
  <text x="120" y="300" class="flow" fill="#1d4ed8">Poll status / progress</text>

  <!-- Legend panels -->
  <rect x="40" y="460" width="500" height="220" rx="10" class="group"/>
  <text x="56" y="486" class="label">Single-document flow</text>
  <text x="56" y="510" class="small">1. UI/ERP ’ Django POST /pdf/single with full snapshot JSON + idempotency key</text>
  <text x="56" y="528" class="small">2. Django writes job row (queued) in PostgreSQL; checks Redis c_max</text>
  <text x="56" y="546" class="small">3. If slot free: worker claims ’ Puppeteer (23s) ’ PUT object ’ hash in Postgres ’ complete</text>
  <text x="56" y="564" class="small">4. Best-effort: download URL when ready (~5s if idle). Else 202 + poll job status</text>
  <text x="56" y="582" class="small">5. Client GET PDF (Range OK). Overload ’ 429/503 admission control</text>
  <text x="56" y="608" class="small">Priority: single jobs claimed before bulk children</text>
  <text x="56" y="632" class="small">Tamper evidence: SHA-256 (+ optional HMAC) stored in PostgreSQL, bytes in object storage</text>
  <text x="56" y="656" class="small">OOM (500+ lines): failed_oom, no blind retry storm</text>

  <rect x="560" y="460" width="480" height="220" rx="10" class="group"/>
  <text x="576" y="486" class="label">Bulk flow (up to 100 PDFs)</text>
  <text x="576" y="510" class="small">1. POST /pdf/bulk with N d 100 frozen snapshots (same accept time)</text>
  <text x="576" y="528" class="small">2. Django creates batch + N child jobs ’ immediate 202 + batch_id</text>
  <text x="576" y="546" class="small">3. Workers render children under global c_max (never 100 parallel browsers)</text>
  <text x="576" y="564" class="small">4. Progress via Redis/Postgres (done/total); UI polls batch status</text>
  <text x="576" y="582" class="small">5. Each PDF stored as object; ZIP built from objects (or on demand)</text>
  <text x="576" y="600" class="small">6. Download ZIP and/or per-PDF URLs  mid-fail retry without regenerate</text>
  <text x="576" y="618" class="small">7. Consistency: no live ERP re-read during batch (snapshot contract)</text>
  <text x="576" y="644" class="small">Layers: Queue = PostgreSQL · Cache/progress = Redis · Storage = objects</text>
  <text x="576" y="662" class="small">Budget posture: one capped worker; peak 1000/min via queue + backpressure</text>
</svg>
